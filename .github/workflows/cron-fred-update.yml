name: Cron — FRED Update

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 평일 09:00 ET (UTC 13:00) — 지표 발표 직후
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call fred-update endpoint
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/fred-update")
          echo "$RESPONSE" | python3 -m json.tool
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ upserted={d.get(\"upserted\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
