name: Cron — Send Weekly Digest Email

on:
  schedule:
    # 매주 월요일 11:00 UTC (07:00 ET) — digest 생성 1시간 후
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send weekly digest email
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/send-weekly-email"

          RESPONSE=$(curl -sL \
            --max-time 55 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/send-weekly-email")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ sent={d.get(\"sent\",0)} failed={d.get(\"failed\",0)} total={d.get(\"total\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
