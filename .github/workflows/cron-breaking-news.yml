name: Cron — Breaking News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call breaking-news endpoint
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/breaking-news"

          # -f 제거 → 4xx/5xx도 응답 본문 출력
          RESPONSE=$(curl -sL \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/breaking-news")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          # 상태코드 체크
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          # JSON 파싱
          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ new={d.get(\"newItems\",0)} high={d.get(\"highItems\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
