name: Cron — Estimate Sync

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call estimate-sync endpoint
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/estimate-sync"

          RESPONSE=$(curl -sL \
            --max-time 25 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/estimate-sync")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ updated={d.get(\"updated\",0)} skipped={d.get(\"skipped\",0)}')
          "
