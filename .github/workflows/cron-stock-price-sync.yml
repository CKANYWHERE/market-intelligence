name: Cron — Stock Price Sync

on:
  schedule:
    # 17:30 ET = 21:30 UTC weekdays (after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync stock daily prices
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/stock-price-sync"

          RESPONSE=$(curl -sL \
            --max-time 55 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/stock-price-sync")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ upserted={d.get(\"upserted\",0)} rows')
          "
