name: Cron — Weekly Market Digest

on:
  schedule:
    # 매일 10:00 UTC (06:00 ET) 실행 — 이미 데이터 있으면 skip
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate weekly digest (skip if exists)
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/weekly-digest"

          RESPONSE=$(curl -sL \
            --max-time 55 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/weekly-digest")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          if d.get('skipped'):
            print(f'⏭ skipped (already exists) weekStart={d.get(\"weekStart\",\"?\")} items={d.get(\"itemCount\",0)} ({d.get(\"durationMs\",0)}ms)')
          else:
            print(f'✓ generated weekStart={d.get(\"weekStart\",\"?\")} items={d.get(\"itemCount\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
