name: Cron — Weekly Market Digest

on:
  schedule:
    # 매주 월요일 10:00 UTC (06:00 ET)
    - cron: '0 10 * * 1'
  workflow_dispatch: # 수동 실행 가능

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Generate weekly digest
        run: |
          curl -f -X GET \
            "${{ secrets.VERCEL_PRODUCTION_URL }}/api/cron/weekly-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 55
