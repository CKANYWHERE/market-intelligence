name: Cron — Daily Calendar

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call daily-calendar endpoint
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/daily-calendar"

          RESPONSE=$(curl -sL \
            --max-time 55 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/daily-calendar")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          c = d.get('counts', {})
          print(f'✓ eco={c.get(\"economic\",0)} earn={c.get(\"earnings\",0)} ipo={c.get(\"ipo\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
