name: Cron — Quote Refresh

on:
  schedule:
    # 평일 장중 (ET 09:30~16:00 = UTC 13:30~20:00) 매 30분
    - cron: '30,0 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call quote-refresh endpoint
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/quote-refresh")
          echo "$RESPONSE" | python3 -m json.tool
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ refreshed={d.get(\"refreshed\",0)} ({d.get(\"durationMs\",0)}ms)')
          "
