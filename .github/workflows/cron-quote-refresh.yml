name: Cron — Quote EOD Snapshot

on:
  schedule:
    # 장 마감(4 PM ET = 21:00 UTC) 후 1시간마다 3회 실행
    - cron: '0 21 * * 1-5'   # 5:00 PM ET
    - cron: '0 22 * * 1-5'   # 6:00 PM ET
    - cron: '0 23 * * 1-5'   # 7:00 PM ET
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call quote-refresh endpoint
        run: |
          echo "▶ Calling ${{ secrets.SITE_URL }}/api/cron/quote-refresh"

          RESPONSE=$(curl -sL \
            --max-time 55 \
            -w "\n__HTTP_STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/quote-refresh")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed '/__HTTP_STATUS__/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import sys, json
          try:
            d = json.loads(sys.stdin.read())
          except Exception as e:
            print('JSON parse error:', e)
            sys.exit(1)
          if not d.get('ok'):
            print('FAILED:', d.get('error'))
            sys.exit(1)
          print(f'✓ refreshed={d.get(\"refreshed\",0)} ({d.get(\"durationMs\",0)}ms)')
          for line in d.get('log', []):
            print(line)
          "
